name: Build and deploy Docker image

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  INTERNAL_API_URL: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && vars.INTERNAL_API_URL_MAIN || vars.INTERNAL_API_URL_DEVELOP || 'http://127.0.0.1:1' }}
  NEXT_PUBLIC_SITE_URL: ${{ (github.ref_name == 'main' || github.base_ref == 'main') && vars.NEXT_PUBLIC_SITE_URL_MAIN || vars.NEXT_PUBLIC_SITE_URL_DEVELOP || 'http://localhost:3000' }}

concurrency:
  group: frontend-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Validate deployment branch
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in develop|main) ;; *) echo "Branch sem ambiente de deploy."; exit 1 ;; esac
      - run: npm install -g npm@11.6.2
      - run: npm ci --no-audit --no-fund
      - run: node scripts/audit.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  verify-image:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --build-arg INTERNAL_API_URL="$INTERNAL_API_URL" --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" --build-arg APP_REVISION="$GITHUB_SHA" --tag local/frontend:${{ github.sha }} .
      - name: Verify runtime user, revision and health
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "local/frontend:$GITHUB_SHA" -c 'test "$(id -u)" != 0 && ! command -v npm'
          container_id="$(docker run --detach --publish 3000:3000 "local/frontend:$GITHUB_SHA")"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            echo "Healthcheck $attempt/20"
            if curl --fail --silent http://127.0.0.1:3000/health | jq --exit-status --arg revision "$GITHUB_SHA" '.status == "ok" and .revision == $revision' >/dev/null; then exit 0; fi
            sleep 3
          done
          docker logs "$container_id"
          exit 1
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: local/frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require environment build configuration
        shell: bash
        env:
          DEVELOP_API_URL: ${{ vars.INTERNAL_API_URL_DEVELOP }}
          MAIN_API_URL: ${{ vars.INTERNAL_API_URL_MAIN }}
          DEVELOP_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL_DEVELOP }}
          MAIN_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL_MAIN }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            develop) api_url="$DEVELOP_API_URL"; site_url="$DEVELOP_SITE_URL" ;;
            main) api_url="$MAIN_API_URL"; site_url="$MAIN_SITE_URL" ;;
            *) exit 1 ;;
          esac
          test -n "$api_url"
          test -n "$site_url"
          echo "INTERNAL_API_URL=$api_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=$site_url" >> "$GITHUB_ENV"
      - name: Normalize image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        id: metadata
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=prd,enable=${{ github.ref_name == 'main' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            INTERNAL_API_URL=${{ env.INTERNAL_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-image:
    if: github.event_name != 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: ${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build-and-push, scan-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ github.ref_name == 'develop' && 'development' || 'production' }}
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.digest }}
      WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify environment image and trigger Dokploy
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            develop) tag=dev ;;
            main) tag=prd ;;
            *) exit 1 ;;
          esac
          test -n "$WEBHOOK_URL"
          test -n "$HEALTHCHECK_URL"
          test -n "$IMAGE_DIGEST"
          sha_digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          tag_digest="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')"
          if [[ "$sha_digest" != "$IMAGE_DIGEST" || "$tag_digest" != "$IMAGE_DIGEST" ]]; then
            echo "A tag do ambiente não aponta para a imagem aprovada desta execução."
            exit 1
          fi
          if ! webhook_status="$(curl --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 --silent --show-error --output /dev/null --write-out '%{http_code}' "$WEBHOOK_URL")"; then
            echo "O webhook do Dokploy falhou com HTTP $webhook_status."
            exit 1
          fi
          if [[ ! "$webhook_status" =~ ^2[0-9][0-9]$ ]]; then
            echo "O webhook do Dokploy respondeu HTTP $webhook_status; esperado HTTP 2xx."
            exit 1
          fi
      - name: Verify deployed frontend
        shell: bash
        run: |
          set -euo pipefail
          url="${HEALTHCHECK_URL%/}/health"
          for attempt in $(seq 1 40); do
            http_response="$(curl --silent --show-error --connect-timeout 10 --max-time 15 --write-out '\n%{http_code}' "$url")" || http_response=$'\n000'
            http_status="${http_response##*$'\n'}"
            response="${http_response%$'\n'*}"
            if [[ "$http_status" == 200 ]] && jq --exit-status --arg revision "$GITHUB_SHA" '.status == "ok" and .revision == $revision' <<< "$response" > /dev/null 2>&1; then
              echo "Frontend disponível com a revisão $GITHUB_SHA (tentativa $attempt/40)."
              exit 0
            fi
            echo "Tentativa $attempt/40: HTTP $http_status; revisão esperada ainda não confirmada."
            if [[ "$attempt" -lt 40 ]]; then
              sleep 5
            fi
          done
          echo "::error::O frontend não respondeu com a revisão $GITHUB_SHA após 40 tentativas (último HTTP $http_status)."
          exit 1
